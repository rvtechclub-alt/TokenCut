[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokencut"
version = "1.0.0"
description = "Context-aware, adaptive AI compression layer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tokencut = "tokencut_next.commands.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
