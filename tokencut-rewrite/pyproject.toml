[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokencut-rewrite"
version = "0.1.0"
description = "Tokencut-inspired rewrite with adaptive compression and CLI controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tokencut-rewrite = "tokencut_rewrite.commands.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]